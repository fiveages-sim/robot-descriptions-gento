# Gento Skye controller defaults.
#
#   split_body:
#     - 臂：ocs2_arm_controller（14-DOF，home 与 m6_ccs 相同）
#     - 腰：body_joint_controller（lift / pitch / yaw）
#     - 头：head_joint_controller
#   full_body:
#     - ocs2_wbc_controller（[body×3 | left×7 | right×7 | head×2]）
#     - 腰/臂/头 home 与分体同一套构型对齐

controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ocs2_arm_controller:
      type: ocs2_arm_controller/Ocs2ArmController

    ocs2_wbc_controller:
      type: ocs2_wbc_controller/Ocs2WbcController

    body_joint_controller:
      type: basic_joint_controller/BasicJointController

    head_joint_controller:
      type: basic_joint_controller/BasicJointController

    left_gripper_controller:
      type: adaptive_gripper_controller/AdaptiveGripperController

    right_gripper_controller:
      type: adaptive_gripper_controller/AdaptiveGripperController

# M6-CCS dual-arm homes (same numbers as m6_ccs_description / fiveages_w2).
# home_1: 作业预备；home_2: 收拢。

ocs2_arm_controller:
  ros__parameters:
    update_rate: 100
    mpc_frequency: 50
    robot_name: gento_skye
    info_file_name: task_arm
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - left_joint7
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - right_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
    home_duration: 5.0
    movej_interpolation_type: doubles
    home_interpolation_type: doubles
    cartesian_defaults:
      frame_id: arm_base
      ik_type: AUTO
      max_linear_velocity: 0.3
      max_linear_acceleration: 1.0
      max_linear_jerk: 5.0
      max_angular_velocity: 0.5
      max_angular_acceleration: 1.0
      max_angular_jerk: 5.0
    home_1: [1.457133809892805, -1.0633699963902674, -1.1994065285584414, -0.8074199090303408, -0.6949558811978124, -0.6864381599253574, -0.1295225067208675,
             -1.457133809892805, -1.0633699963902674, 1.1994065285584414, -0.8074199090303408, 0.6949558811978124, -0.6864381599253574, 0.1295225067208675]
    home_2: [2.502, -1.528, -1.562, -1.680, 0.0, -0.787, 0.0,
             -2.502, -1.528, 1.562, -1.680, 0.0, -0.787, 0.0]

ocs2_wbc_controller:
  ros__parameters:
    update_rate: 100
    mpc_frequency: 50
    robot_name: gento_skye
    info_file_name: task
    # [body 1–3 | left 1–7 | right 1–7 | head 1–2]
    joints:
      - body_joint1
      - body_joint2
      - body_joint3
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - left_joint7
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - right_joint7
      - head_joint1
      - head_joint2
    command_interfaces:
      - position
    state_interfaces:
      - position
    home_duration: 5.0
    movej_interpolation_type: doubles
    waist_lifting_enabled: true
    waist_lifting_duration: 3.0
    waist_lifting_type: single_joint
    waist_single_joint_direction: 1.0
    waist_single_joint_offset: 0.0
    waist_single_joint_pitch_joint: body_joint2
    waist_single_joint_pitch_direction: 1.0
    waist_single_joint_pitch_offset: 0.0
    waist_lifting_default_parameter: [0.08, 0.5, 1.0]
    waist_turning_default_parameter: [0.2, 0.5, 1.0]
    cartesian_defaults:
      frame_id: arm_base
      ik_type: AUTO
      max_linear_velocity: 0.3
      max_linear_acceleration: 1.0
      max_linear_jerk: 5.0
      max_angular_velocity: 0.5
      max_angular_acceleration: 1.0
      max_angular_jerk: 5.0
    # body: lift 0.30 m 直立；臂 = m6_ccs home_1
    home_1: [0.60, 0.0, 0.0,
             1.457133809892805, -1.0633699963902674, -1.1994065285584414, -0.8074199090303408, -0.6949558811978124, -0.6864381599253574, -0.1295225067208675,
             -1.457133809892805, -1.0633699963902674, 1.1994065285584414, -0.8074199090303408, 0.6949558811978124, -0.6864381599253574, 0.1295225067208675,
             0.0, 0.0]
    # body: lift 0.50 m、pitch -0.35 rad 前倾；臂 = m6_ccs home_2
    home_2: [0.0, 0.0, 0.0,
             2.502, -1.528, -1.562, -2.4, 0.0, -0.787, 0.0,
             -2.502, -1.528, 1.562, -2.4, 0.0, -0.787, 0.0,
             0.0, 0.0]

body_joint_controller:
  ros__parameters:
    update_rate: 100
    joints:
      - body_joint1
      - body_joint2
      - body_joint3
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    home_duration: 5.0
    movej_duration: 2.0
    movej_interpolation_type: doubles
    home_interpolation_type: doubles
    home_1: [0.30, 0.0, 0.0]
    home_2: [0.50, -0.35, 0.0]
    waist_lifting_enabled: true
    waist_lifting_duration: 3.0
    waist_lifting_type: single_joint
    waist_single_joint_direction: 1.0
    waist_single_joint_offset: 0.0
    waist_single_joint_pitch_joint: body_joint2
    waist_single_joint_pitch_direction: 1.0
    waist_single_joint_pitch_offset: 0.0
    waist_lifting_default_parameter: [0.08, 0.5, 1.0]
    waist_turning_default_parameter: [0.2, 0.5, 1.0]
    waist_absolute_source_frame: base_footprint
    waist_absolute_target_frame: body_base

head_joint_controller:
  ros__parameters:
    update_rate: 100
    joints:
      - head_joint1
      - head_joint2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    home_duration: 5.0
    movej_duration: 5.0
    home_1: [0.0, 0.0]
    home_2: [0.0, 0.0]

left_gripper_controller:
  ros__parameters:
    joint: left_gripper_joint
    use_effort_interface: false

right_gripper_controller:
  ros__parameters:
    joint: right_gripper_joint
    use_effort_interface: false
